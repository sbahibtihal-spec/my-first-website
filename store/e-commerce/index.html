<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NAIMA STORE | متجر نعيمة</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Tahoma, sans-serif;
            background: #f7f7f7;
            color: #222;
        }

        button,
        input,
        select {
            font-family: inherit;
        }

        /* ===== HEADER ===== */

        header {
            background: #111;
            color: white;
            padding: 18px 6%;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .navbar {
            max-width: 1200px;
            margin: auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
        }

        .logo {
            font-size: 27px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .logo span {
            color: #e91e63;
        }

        .nav-buttons {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .cart-button {
            position: relative;
            border: none;
            background: #e91e63;
            color: white;
            padding: 12px 18px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 16px;
        }

        .cart-count {
            position: absolute;
            top: -8px;
            right: -5px;
            background: white;
            color: #e91e63;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            font-size: 13px;
        }

        /* ===== HERO ===== */

        .hero {
            min-height: 380px;
            background: linear-gradient(135deg, #111, #3b1024);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 50px 20px;
        }

        .hero-content {
            max-width: 800px;
        }

        .hero h1 {
            font-size: 48px;
            margin-bottom: 15px;
        }

        .hero h1 span {
            color: #e91e63;
        }

        .hero p {
            font-size: 19px;
            color: #ddd;
            line-height: 1.8;
        }

        /* ===== SEARCH ===== */

        .search-section {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .search-box {
            display: flex;
            gap: 10px;
        }

        .search-box input {
            width: 100%;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
            outline: none;
        }

        .search-box input:focus {
            border-color: #e91e63;
        }

        /* ===== CATEGORIES ===== */

        .categories {
            max-width: 1200px;
            margin: 20px auto 35px;
            padding: 0 20px;
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .category {
            padding: 10px 20px;
            border: 1px solid #ddd;
            background: white;
            border-radius: 25px;
            cursor: pointer;
            transition: .2s;
        }

        .category:hover,
        .category.active {
            background: #e91e63;
            color: white;
            border-color: #e91e63;
        }

        /* ===== PRODUCTS ===== */

        .products-section {
            max-width: 1200px;
            margin: auto;
            padding: 0 20px 70px;
        }

        .section-title {
            text-align: center;
            margin-bottom: 30px;
        }

        .section-title h2 {
            font-size: 32px;
            margin-bottom: 8px;
        }

        .section-title p {
            color: #777;
        }

        .products {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 25px;
        }

        .product {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 5px 25px rgba(0,0,0,.08);
            transition: .3s;
        }

        .product:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0,0,0,.13);
        }

        .product-image {
            height: 280px;
            overflow: hidden;
            position: relative;
            background: #eee;
        }

        .product-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: .4s;
        }

        .product:hover img {
            transform: scale(1.05);
        }

        .badge {
            position: absolute;
            top: 12px;
            right: 12px;
            background: #e91e63;
            color: white;
            padding: 7px 12px;
            border-radius: 20px;
            font-size: 13px;
        }

        .product-info {
            padding: 20px;
        }

        .product-info h3 {
            margin-bottom: 8px;
            font-size: 19px;
        }

        .product-info p {
            color: #777;
            line-height: 1.6;
            font-size: 14px;
            min-height: 45px;
        }

        .price {
            color: #e91e63;
            font-size: 22px;
            font-weight: bold;
            margin: 15px 0;
        }

        .add-button {
            width: 100%;
            border: none;
            background: #111;
            color: white;
            padding: 13px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            transition: .2s;
        }

        .add-button:hover {
            background: #e91e63;
        }

        /* ===== MODAL ===== */

        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,.65);
            z-index: 2000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal.show {
            display: flex;
        }

        .modal-content {
            background: white;
            width: 100%;
            max-width: 500px;
            border-radius: 18px;
            padding: 25px;
            position: relative;
            max-height: 90vh;
            overflow-y: auto;
        }

        .close-modal {
            position: absolute;
            left: 18px;
            top: 15px;
            border: none;
            background: #eee;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 20px;
        }

        .modal-content h2 {
            margin-bottom: 20px;
        }

        .option-title {
            font-weight: bold;
            margin: 18px 0 10px;
        }

        .options {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .option {
            border: 1px solid #ccc;
            background: white;
            padding: 10px 18px;
            border-radius: 8px;
            cursor: pointer;
        }

        .option.selected {
            background: #e91e63;
            color: white;
            border-color: #e91e63;
        }

        .color-option {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            border: 3px solid white;
            outline: 1px solid #ccc;
            cursor: pointer;
        }

        .color-option.selected {
            outline: 3px solid #e91e63;
        }

        .confirm-add {
            width: 100%;
            border: none;
            background: #e91e63;
            color: white;
            padding: 15px;
            margin-top: 25px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 17px;
            font-weight: bold;
        }

        /* ===== CART ===== */

        .cart-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,.5);
            z-index: 3000;
        }

        .cart-overlay.show {
            display: block;
        }

        .cart {
            position: fixed;
            top: 0;
            left: -430px;
            width: 400px;
            max-width: 92%;
            height: 100vh;
            background: white;
            z-index: 4000;
            transition: .3s;
            display: flex;
            flex-direction: column;
        }

        .cart.open {
            left: 0;
        }

        .cart-header {
            padding: 20px;
            background: #111;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .close-cart {
            border: none;
            background: transparent;
            color: white;
            font-size: 25px;
            cursor: pointer;
        }

        .cart-items {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
        }

        .empty-cart {
            text-align: center;
            color: #777;
            margin-top: 60px;
        }

        .cart-item {
            display: flex;
            gap: 12px;
            padding: 15px 0;
            border-bottom: 1px solid #eee;
        }

        .cart-item img {
            width: 80px;
            height: 90px;
            object-fit: cover;
            border-radius: 8px;
        }

        .cart-item-info {
            flex: 1;
        }

        .cart-item-info h4 {
            margin-bottom: 7px;
        }

        .cart-item-info small {
            color: #777;
            display: block;
            margin-bottom: 5px;
        }

        .cart-price {
            color: #e91e63;
            font-weight: bold;
        }

        .quantity {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 8px;
        }

        .quantity button {
            width: 27px;
            height: 27px;
            border: none;
            background: #eee;
            cursor: pointer;
            border-radius: 5px;
        }

        .remove {
            border: none;
            background: none;
            color: #d00;
            cursor: pointer;
            margin-top: 8px;
        }

        .cart-footer {
            padding: 20px;
            border-top: 1px solid #ddd;
        }

        .total {
            display: flex;
            justify-content: space-between;
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .checkout {
            width: 100%;
            border: none;
            background: #25D366;
            color: white;
            padding: 15px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 17px;
            font-weight: bold;
        }

        /* ===== FOOTER ===== */

        footer {
            background: #111;
            color: white;
            padding: 40px 20px;
            text-align: center;
        }

        footer h2 {
            margin-bottom: 10px;
        }

        footer p {
            color: #bbb;
            line-height: 1.8;
        }

        /* ===== MOBILE ===== */

        @media (max-width: 900px) {
            .products {
                grid-template-columns: repeat(2, 1fr);
            }

            .hero h1 {
                font-size: 38px;
            }
        }

        @media (max-width: 600px) {
            .navbar {
                flex-direction: column;
            }

            .products {
                grid-template-columns: 1fr;
            }

            .product-image {
                height: 330px;
            }

            .hero h1 {
                font-size: 32px;
            }

            .hero p {
                font-size: 16px;
            }

            .cart {
                width: 360px;
            }
        }
    </style>
</head>

<body>

<!-- ================= HEADER ================= -->

<header>
    <div class="navbar">

        <div class="logo">
            NAIMA <span>STORE</span>
        </div>

        <div class="nav-buttons">
            <button class="cart-button" onclick="openCart()">
                🛒 السلة
                <span class="cart-count" id="cartCount">0</span>
            </button>
        </div>

    </div>
</header>


<!-- ================= HERO ================= -->

<section class="hero">

    <div class="hero-content">

        <h1>
            مرحباً بك في
            <span>NAIMA STORE</span>
        </h1>

        <p>
            اكتشفي تشكيلتنا المميزة من المنتجات
            واخترِي ما يناسبك بسهولة وأمان.
        </p>

    </div>

</section>


<!-- ================= SEARCH ================= -->

<section class="search-section">

    <div class="search-box">

        <input
            type="text"
            id="searchInput"
            placeholder="🔎 ابحثي عن منتج..."
            oninput="searchProducts()"
        >

    </div>

</section>


<!-- ================= CATEGORIES ================= -->

<div class="categories">

    <button class="category active"
            onclick="filterCategory('all', this)">
        الكل
    </button>

    <button class="category"
            onclick="filterCategory('clothes', this)">
        👗 ملابس
    </button>

    <button class="category"
            onclick="filterCategory('shoes', this)">
        👟 أحذية
    </button>

    <button class="category"
            onclick="filterCategory('bags', this)">
        👜 حقائب
    </button>

    <button class="category"
            onclick="filterCategory('accessories', this)">
        💍 إكسسوارات
    </button>

</div>


<!-- ================= PRODUCTS ================= -->

<section class="products-section">

    <div class="section-title">

        <h2>منتجاتنا</h2>

        <p>
            اختاري المنتج الذي يعجبك
        </p>

    </div>

    <div class="products" id="productsContainer"></div>

</section>


<!-- ================= PRODUCT MODAL ================= -->

<div class="modal" id="productModal">

    <div class="modal-content">

        <button class="close-modal" onclick="closeModal()">
            ×
        </button>

        <h2 id="modalProductName">
            اختيار المنتج
        </h2>

        <p id="modalProductPrice"></p>


        <!-- SIZE -->

        <div class="option-title">
            اختاري المقاس:
        </div>

        <div class="options" id="sizeOptions">

            <button class="option" onclick="selectSize(this,'S')">
                S
            </button>

            <button class="option" onclick="selectSize(this,'M')">
                M
            </button>

            <button class="option" onclick="selectSize(this,'L')">
                L
            </button>

            <button class="option" onclick="selectSize(this,'XL')">
                XL
            </button>

        </div>


        <!-- COLOR -->

        <div class="option-title">
            اختاري اللون:
        </div>

        <div class="options">

            <button
                class="color-option"
                style="background:#111"
                onclick="selectColor(this,'أسود')">
            </button>

            <button
                class="color-option"
                style="background:#fff"
                onclick="selectColor(this,'أبيض')">
            </button>

            <button
                class="color-option"
                style="background:#e91e63"
                onclick="selectColor(this,'وردي')">
            </button>

            <button
                class="color-option"
                style="background:#1e88e5"
                onclick="selectColor(this,'أزرق')">
            </button>

        </div>


        <button class="confirm-add" onclick="confirmAddToCart()">
            🛒 أضف إلى السلة
        </button>

    </div>

</div>


<!-- ================= CART ================= -->

<div class="cart-overlay" id="cartOverlay" onclick="closeCart()"></div>

<div class="cart" id="cart">

    <div class="cart-header">

        <h2>
            🛒 سلة المشتريات
        </h2>

        <button class="close-cart" onclick="closeCart()">
            ×
        </button>

    </div>


    <div class="cart-items" id="cartItems">

        <div class="empty-cart">
            السلة فارغة 🛒
        </div>

    </div>


    <div class="cart-footer">

        <div class="total">

            <span>
                المجموع:
            </span>

            <span>
                <span id="cartTotal">0</span> DH
            </span>

        </div>

        <button class="checkout" onclick="checkoutWhatsApp()">
            📲 إتمام الطلب عبر WhatsApp
        </button>

    </div>

</div>


<!-- ================= FOOTER ================= -->

<footer>

    <h2>NAIMA STORE</h2>

    <p>
        شكراً لثقتكم بنا ❤️
    </p>

    <p>
        للتواصل: 0700000000
    </p>

</footer>


<script>

    /* =========================================
       PRODUCTS
    ========================================= */

    const products = [

        {
            id: 1,
            name: "فستان أنيق",
            price: 420,
            category: "clothes",
            description: "فستان أنيق مناسب للمناسبات والاستعمال اليومي.",
            image: "https://images.unsplash.com/photo-1595777457583-95e059d581b8?auto=format&fit=crop&w=800&q=80"
        },

        {
            id: 2,
            name: "حقيبة نسائية أنيقة",
            price: 250,
            category: "bags",
            description: "حقيبة عملية وعصرية للاستعمال اليومي.",
            image: "https://images.unsplash.com/photo-1584917865442-de89df76afd3?auto=format&fit=crop&w=800&q=80"
        },

        {
            id: 3,
            name: "حذاء رياضي مريح",
            price: 350,
            category: "shoes",
            description: "حذاء مريح وأنيق للحياة اليومية.",
            image: "https://images.unsplash.com/photo-1542291026-7eec264c27ff?auto=format&fit=crop&w=800&q=80"
        },

        {
            id: 4,
            name: "ساعة ذكية",
            price: 399,
            category: "accessories",
            description: "ساعة بتصميم أنيق ومناسبة للاستعمال اليومي.",
            image: "https://images.unsplash.com/photo-1523275335684-37898b6baf30?auto=format&fit=crop&w=800&q=80"
        },

        {
            id: 5,
            name: "نظارات شمسية عصرية",
            price: 180,
            category: "accessories",
            description: "تصميم عصري وأنيق للإطلالات اليومية.",
            image: "https://images.unsplash.com/photo-1511499767150-a48a237f0083?auto=format&fit=crop&w=800&q=80"
        },

        {
            id: 6,
            name: "حقيبة جلدية",
            price: 320,
            category: "bags",
            description: "حقيبة جلدية أنيقة وعملية.",
            image: "https://images.unsplash.com/photo-1553062407-98eeb64c6a62?auto=format&fit=crop&w=800&q=80"
        }

    ];


    /* =========================================
       CART
    ========================================= */

    let cart = JSON.parse(localStorage.getItem("naimaCart")) || [];


    let selectedProduct = null;
    let selectedSize = null;
    let selectedColor = null;


    /* =========================================
       DISPLAY PRODUCTS
    ========================================= */

    function displayProducts(list = products) {

        const container =
            document.getElementById("productsContainer");

        container.innerHTML = "";

        if (list.length === 0) {

            container.innerHTML = `
                <p style="
                    text-align:center;
                    grid-column:1/-1;
                    padding:50px;
                ">
                    لا توجد منتجات 😔
                </p>
            `;

            return;
        }


        list.forEach(product => {

            const card = document.createElement("div");

            card.className = "product";


            card.innerHTML = `

                <div class="product-image">

                    <img
                        src="${product.image}"
                        alt="${product.name}"
                    >

                    <span class="badge">
                        جديد
                    </span>

                </div>

                <div class="product-info">

                    <h3>
                        ${product.name}
                    </h3>

                    <p>
                        ${product.description}
                    </p>

                    <div class="price">
                        ${product.price} DH
                    </div>

                    <button
                        class="add-button"
                        onclick="openProductModal(${product.id})"
                    >
                        🛒 أضف إلى السلة
                    </button>

                </div>
            `;


            container.appendChild(card);

        });

    }


    /* =========================================
       OPEN PRODUCT MODAL
    ========================================= */

    function openProductModal(id) {

        selectedProduct =
            products.find(product => product.id === id);

        selectedSize = null;
        selectedColor = null;


        document.getElementById("modalProductName")
            .textContent = selectedProduct.name;

        document.getElementById("modalProductPrice")
            .textContent =
            selectedProduct.price + " DH";


        document
            .querySelectorAll(".option")
            .forEach(button => {
                button.classList.remove("selected");
            });


        document
            .querySelectorAll(".color-option")
            .forEach(button => {
                button.classList.remove("selected");
            });


        document
            .getElementById("productModal")
            .classList.add("show");

    }


    /* =========================================
       SELECT SIZE
    ========================================= */

    function selectSize(button, size) {

        document
            .querySelectorAll(".option")
            .forEach(item => {
                item.classList.remove("selected");
            });


        button.classList.add("selected");

        selectedSize = size;

    }


    /* =========================================
       SELECT COLOR
    ========================================= */

    function selectColor(button, color) {

        document
            .querySelectorAll(".color-option")
            .forEach(item => {
                item.classList.remove("selected");
            });


        button.classList.add("selected");

        selectedColor = color;

    }


    /* =========================================
       ADD TO CART
    ========================================= */

    function confirmAddToCart() {

        if (!selectedSize) {

            alert("من فضلك اختاري المقاس أولاً.");

            return;
        }


        if (!selectedColor) {

            alert("من فضلك اختاري اللون أولاً.");

            return;
        }


        const existingItem = cart.find(item =>
            item.id === selectedProduct.id &&
            item.size === selectedSize &&
            item.color === selectedColor
        );


        if (existingItem) {

            existingItem.quantity++;

        } else {

            cart.push({

                id: selectedProduct.id,

                name: selectedProduct.name,

                price: selectedProduct.price,

                image: selectedProduct.image,

                size: selectedSize,

                color: selectedColor,

                quantity: 1

            });

        }


        saveCart();

        closeModal();

        updateCart();

        openCart();


        alert("تمت إضافة المنتج إلى السلة ✅");

    }


    /* =========================================
       SAVE CART
    ========================================= */

    function saveCart() {

        localStorage.setItem(
            "naimaCart",
            JSON.stringify(cart)
        );

    }


    /* =========================================
       UPDATE CART
    ========================================= */

    function updateCart() {

        const cartItems =
            document.getElementById("cartItems");

        const cartCount =
            document.getElementById("cartCount");

        const cartTotal =
            document.getElementById("cartTotal");


        if (cart.length === 0) {

            cartItems.innerHTML = `
                <div class="empty-cart">
                    السلة فارغة 🛒
                </div>
            `;

        } else {

            cartItems.innerHTML = "";


            cart.forEach((item, index) => {

                const div =
                    document.createElement("div");

                div.className = "cart-item";


                div.innerHTML = `

                    <img
                        src="${item.image}"
                        alt="${item.name}"
                    >

                    <div class="cart-item-info">

                        <h4>
                            ${item.name}
                        </h4>

                        <small>
                            المقاس: ${item.size}
                        </small>

                        <small>
                            اللون: ${item.color}
                        </small>

                        <div class="cart-price">
                            ${item.price} DH
                        </div>

                        <div class="quantity">

                            <button
                                onclick="changeQuantity(${index}, -1)"
                            >
                                −
                            </button>

                            <span>
                                ${item.quantity}
                            </span>

                            <button
                                onclick="changeQuantity(${index}, 1)"
                            >
                                +
                            </button>

                        </div>

                        <button
                            class="remove"
                            onclick="removeItem(${index})"
                        >
                            🗑 حذف
                        </button>

                    </div>
                `;


                cartItems.appendChild(div);

            });

        }


        const quantity =
            cart.reduce(
                (total, item) =>
                    total + item.quantity,
                0
            );


        const total =
            cart.reduce(
                (total, item) =>
                    total +
                    item.price * item.quantity,
                0
            );


        cartCount.textContent = quantity;

        cartTotal.textContent = total;

    }


    /* =========================================
       QUANTITY
    ========================================= */

    function changeQuantity(index, amount) {

        cart[index].quantity += amount;


        if (cart[index].quantity <= 0) {

            cart.splice(index, 1);

        }


        saveCart();

        updateCart();

    }


    /* =========================================
       REMOVE
    ========================================= */

    function removeItem(index) {

        cart.splice(index, 1);

        saveCart();

        updateCart();

    }


    /* =========================================
       OPEN CART
    ========================================= */

    function openCart() {

        document
            .getElementById("cart")
            .classList.add("open");

        document
            .getElementById("cartOverlay")
            .classList.add("show");

    }


    /* =========================================
       CLOSE CART
    ========================================= */

    function closeCart() {

        document
            .getElementById("cart")
            .classList.remove("open");

        document
            .getElementById("cartOverlay")
            .classList.remove("show");

    }


    /* =========================================
       CLOSE MODAL
    ========================================= */

    function closeModal() {

        document
            .getElementById("productModal")
            .classList.remove("show");

    }


    /* =========================================
       SEARCH
    ========================================= */

    function searchProducts() {

        const text =
            document
                .getElementById("searchInput")
                .value
                .toLowerCase();


        const result =
            products.filter(product =>
                product.name
                    .toLowerCase()
                    .includes(text)
            );


        displayProducts(result);

    }


    /* =========================================
       FILTER CATEGORY
    ========================================= */

    function filterCategory(category, button) {

        document
            .querySelectorAll(".category")
            .forEach(item =>
                item.classList.remove("active")
            );


        button.classList.add("active");


        if (category === "all") {

            displayProducts(products);

        } else {

            displayProducts(
                products.filter(
                    product =>
                        product.category === category
                )
            );

        }

    }


    /* =========================================
       WHATSAPP CHECKOUT
    ========================================= */

    function checkoutWhatsApp() {

        if (cart.length === 0) {

            alert("السلة فارغة.");

            return;
        }


        let message =
            "السلام عليكم، أريد طلب المنتجات التالية من NAIMA STORE:%0A%0A";


        cart.forEach(item => {

            message +=
                "🛍️ " +
                item.name +
                "%0A" +

                "المقاس: " +
                item.size +
                "%0A" +

                "اللون: " +
                item.color +
                "%0A" +

                "الكمية: " +
                item.quantity +
                "%0A" +

                "السعر: " +
                (item.price * item.quantity) +
                " DH%0A%0A";

        });


        const total =
            cart.reduce(
                (sum, item) =>
                    sum +
                    item.price * item.quantity,
                0
            );


        message +=
            "💰 المجموع: " +
            total +
            " DH";


        /*
          غيري الرقم هنا إلى رقم WhatsApp الخاص بمتجرك
          اكتبيه بصيغة دولية بدون +
          مثال المغرب:
          2126XXXXXXXX
        */

        const phone =
            "212700000000";


        const url =
            "https://wa.me/" +
            phone +
            "?text=" +
            message;


        window.open(url, "_blank");

    }


    /* =========================================
       START
    ========================================= */

    displayProducts();

    updateCart();

</script>

</body>
